# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Set minimum target version to 26.2 for backward compatibility
# Check available versions on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Build artifact tagged with base supported version
mod_version=0.2.2+26.2
maven_group=com.smm

# Dependencies
# Fabric API release matching the base 26.2 version
fabric_api_version=0.160.0+26.2
