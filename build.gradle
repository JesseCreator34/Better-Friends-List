plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from here.
	// Only needed when depending on third-party mod APIs or external libraries.
	// Loom automatically adds essential repositories for Minecraft and common libraries.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
}

dependencies {
	// Minecraft and Fabric Loader dependencies configured via gradle.properties.
	// Compiles against the base supported version (e.g., 26.2) for forward compatibility.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (module set matching the target base Minecraft version).
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	// Expand the version placeholder inside fabric.mod.json during resource processing
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Target Java 25 bytecode release for Minecraft 26.2+
	it.options.release = 25
	// Ensure UTF-8 encoding across all operating systems to prevent i18n encoding issues
	it.options.encoding = "UTF-8"
}

java {
	// Loom automatically attaches sourcesJar to RemapSourcesJar and the build task.
	// Kept to generate developer source jars for debugging and publishing.
	withSourcesJar()

	// Java language level compatibility settings
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Bundle the LICENSE file with the project name suffix into the root of the JAR
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Configure Maven publication for publishing artifacts
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// Repositories for publishing built artifacts (not for resolving dependencies).
	// See https://docs.gradle.org/current/userguide/publishing_maven.html
	repositories {
	}
}

base {
	// Output JAR artifact base name
	archivesName = "better-friends-list"
}
